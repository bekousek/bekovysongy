name: Deploy to GitHub Pages

# Spustí se po každém pushi do main (tj. po každém uložení z /admin) i ručně.
# Concurrency se skupinou "pages": běžící deploy se NEruší (cancel-in-progress:
# false – doporučení GitHubu pro Pages, brání CDN race), ale rychlá po sobě
# jdoucí uložení se ve frontě sloučí – počká se na běžící deploy a pak naběhne
# jen poslední stav. Veřejné repo = Actions minuty zdarma, žádný build-minutový strop.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Run tests (sections.js, song-cleanup.js, transposition)
        run: npm test
      - name: Validate songs.json against songs/*.html
        run: npm run validate

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble public site
        # Allowlist, not a blocklist: only these paths are published. Repo also
        # has internal tooling (scripts, reports, staging data) that must never
        # be served publicly - anything not listed here stays out of the artifact.
        run: |
          mkdir -p _site
          cp .nojekyll _site/
          cp index.html 404.html robots.txt sw.js offline.html manifest.json _site/
          # Google Search Console ownership proof: Google fetches it at the
          # site root, so it has to be in the allowlist or the property drops
          # back to unverified on the next deploy.
          cp google1ee20b2a247703cf.html _site/
          cp -r css js assets songs admin _site/
          # na-kytaru/ is only a redirect now: the song list lives at the root.
          cp -r na-kytaru _site/
          # song-previews.json is fetched at runtime by js/song-preview.js, so
          # unlike the rest of the triage tooling it has to be published.
          cp songs.json song-previews.json _site/
          node scripts/generate-sitemap.js > _site/sitemap.xml
          # Lyrics index for the song list's full-text search. Generated here
          # rather than committed: songs/*.html changes on every save from
          # /admin, so a committed copy would go stale between deploys.
          node scripts/build-search-index.js > _site/search-index.json
          # The songbook's slice of song-previews.json: published songs with an
          # exact match only. Generated rather than committed so it can't drift
          # from the full file it's derived from.
          node scripts/build-public-previews.js > _site/song-previews-public.json
          # The service worker names its shell cache after the published
          # skeleton (JS, CSS, the pages that aren't songs, fonts and icons),
          # so changing any of it reaches returning visitors on their next
          # visit - no number to bump by hand. Songs and songs.json live in a
          # cache of their own and don't count.
          SHELL_HASH=$(cd _site && find css js admin assets na-kytaru index.html 404.html offline.html manifest.json -type f | LC_ALL=C sort | xargs sha1sum | sha1sum | cut -c1-12)
          sed -i "s/^const SHELL_VERSION = 'dev';/const SHELL_VERSION = '${SHELL_HASH}';/" _site/sw.js
          grep -q "^const SHELL_VERSION = '${SHELL_HASH}';" _site/sw.js || { echo "sw.js: SHELL_VERSION placeholder not found"; exit 1; }
          echo "Shell version ${SHELL_HASH}"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
