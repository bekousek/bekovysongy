name: Deploy to GitHub Pages

# Spustí se po každém pushi do main (tj. po každém uložení z /admin) i ručně.
# Concurrency se skupinou "pages": běžící deploy se NEruší (cancel-in-progress:
# false – doporučení GitHubu pro Pages, brání CDN race), ale rychlá po sobě
# jdoucí uložení se ve frontě sloučí – počká se na běžící deploy a pak naběhne
# jen poslední stav. Veřejné repo = Actions minuty zdarma, žádný build-minutový strop.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run tests (sections.js, song-cleanup.js, transposition)
        run: npm test
      - name: Validate songs.json against songs/*.html
        run: npm run validate

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble public site
        # Allowlist, not a blocklist: only these paths are published. Repo also
        # has internal tooling (scripts, reports, staging data) that must never
        # be served publicly - anything not listed here stays out of the artifact.
        run: |
          mkdir -p _site
          cp .nojekyll _site/
          cp index.html 404.html robots.txt sw.js offline.html manifest.json _site/
          cp -r css js assets songs admin _site/
          cp -r na-kytaru na-foukaci-harmoniku na-kalimbu _site/
          cp songs.json _site/
          node scripts/generate-sitemap.js > _site/sitemap.xml
          # Lyrics index for the song list's full-text search. Generated here
          # rather than committed: songs/*.html changes on every save from
          # /admin, so a committed copy would go stale between deploys.
          node scripts/build-search-index.js > _site/search-index.json
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
