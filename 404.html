<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stránka nenalezena - Bekovy songy</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e0d0c">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    // Addresses that used to exist go where their content went before the
    // page even draws: the old instrument pages and the redesign trials
    // (/test1-4/, whose invites ?parta=... must keep working) to the list at
    // the root, and the trial song page to the song's own page.
    (function () {
      var m = location.pathname.match(/^(\/bekovysongy)?(\/.*)$/);
      var base = (m && m[1] ? m[1] : '') + '/';
      var path = m ? m[2] : location.pathname;
      var q = new URLSearchParams(location.search);
      var to = null;
      if (/^\/test4\/pisen\.html$/.test(path) && q.get('s')) {
        var s = q.get('s');
        q.delete('s');
        var rest = q.toString();
        to = base + 'songs/' + encodeURIComponent(s) + '.html' + (rest ? '?' + rest : '');
      } else if (/^\/(test[1-4]|na-foukaci-harmoniku|na-kalimbu)(\/|$)/.test(path)) {
        to = base + location.search + location.hash;
      }
      if (to) location.replace(to);
    })();
  </script>
  <!-- Self-contained on purpose: a 404 can be hit from any path depth. -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0e0d0c;
      color: #f2f2f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .box { max-width: 420px; }
    .box h1 { font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 10px; }
    .box p { color: #b6b1aa; font-size: 17px; line-height: 1.45; margin-bottom: 22px; }
    .box a {
      display: inline-flex; align-items: center; height: 48px; padding: 0 22px;
      background: #e67e22; color: #160b02; border-radius: 999px;
      font-weight: 600; font-size: 16px; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Tahle stránka tu není</h1>
    <p>Píseň nebo stránka, kterou hledáš, neexistuje, nebo se v odkazu něco přepsalo.</p>
    <a href="/" id="home-link">Do zpěvníku</a>
  </div>
  <script>
    // Works on the GitHub Pages project subpath (…/bekovysongy/) as well as
    // on the custom domain root.
    var m = location.pathname.match(/^\/bekovysongy\//);
    if (m) document.getElementById('home-link').href = m[0];
  </script>
</body>
</html>
