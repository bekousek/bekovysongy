<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Bekovy songy</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e0d0c">
  <meta name="color-scheme" content="dark">
  <!-- Self-contained on purpose: shown by the service worker as a last
       resort when neither the network nor the cache have the page, so it
       can't depend on css/style.css possibly being unavailable too. -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0e0d0c;
      color: #f2f2f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .box { max-width: 420px; }
    .box h1 { font-size: 28px; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 10px; }
    .box p { color: #b6b1aa; font-size: 17px; line-height: 1.45; margin-bottom: 22px; }
    .box a {
      display: inline-flex; align-items: center; height: 48px; padding: 0 22px;
      background: #e67e22; color: #160b02; border-radius: 999px;
      font-weight: 600; font-size: 16px; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Jsi offline</h1>
    <p>Tahle stránka ještě není uložená pro offline použití. Písně otevřené
    dřív fungují i bez signálu a celý zpěvník si stáhneš v záložce Moje.</p>
    <a href="/" id="home-link">Do zpěvníku</a>
  </div>
  <script>
    // Shown in place of any page, songs/ included, so the way home can't be
    // relative. Works on the GitHub Pages project subpath (…/bekovysongy/) as
    // well as on the custom domain root.
    var m = location.pathname.match(/^\/bekovysongy\//);
    if (m) document.getElementById('home-link').href = m[0];
  </script>
</body>
</html>
