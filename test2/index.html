<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Návrh 2: Rejstřík - Bekovy songy</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#fbf7f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151012" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip" href="#index">Přeskočit na seznam</a>

  <header class="top">
    <a class="brand" href="../" aria-label="Bekovy songy, úvod">
      <span class="brand-mark" id="brand-mark"></span>
      <span>Bekovy songy</span>
    </a>
    <nav class="site-nav" aria-label="Nástroje">
      <a href="../na-kytaru/" aria-current="page">Na kytaru</a>
      <a href="../na-foukaci-harmoniku/">Na harmoniku</a>
      <a href="../na-kalimbu/">Na kalimbu</a>
    </nav>
    <button type="button" class="btn btn-accent" id="random"><span data-icon="shuffle"></span><span>Náhodná</span></button>
  </header>

  <main>
    <div class="intro">
      <h1>Na kytaru</h1>
      <p class="sub" id="sub"></p>
    </div>

    <div class="band" id="band">
      <div class="search">
        <label class="visually-hidden" for="q">Hledat píseň</label>
        <span class="search-icon" data-icon="search"></span>
        <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
               enterkeyhint="search" placeholder="Název, interpret nebo úryvek textu…"
               aria-describedby="q-hint">
        <button type="button" class="search-clear" id="q-clear" aria-label="Smazat hledání" hidden><span data-icon="x"></span></button>
      </div>
      <button type="button" class="filter-btn" id="filter-btn" aria-haspopup="dialog">
        <span data-icon="sliders"></span><span class="filter-label">Filtr</span><span class="badge" id="filter-badge" hidden></span>
      </button>
    </div>

    <p class="hint" id="q-hint">Nevíš název? Napiš řádek, který si pamatuješ.</p>

    <div class="modes" role="radiogroup" aria-label="Rejstřík podle" id="modes">
      <button type="button" role="radio" data-mode="title">Podle názvu</button>
      <button type="button" role="radio" data-mode="author">Podle interpreta</button>
      <button type="button" role="radio" data-mode="added">Nové</button>
    </div>

    <div class="active" id="active" aria-label="Zapnuté filtry"></div>

    <p class="count" id="count" aria-live="polite"></p>
    <div id="index" tabindex="-1"></div>
  </main>

  <nav class="rail" id="rail" aria-label="Skok na písmeno" hidden></nav>
  <div class="rail-bubble" id="rail-bubble" aria-hidden="true"></div>

  <footer class="foot">
    <div class="offline" id="offline-footer" hidden>
      <p><strong>Jedeš na chatu?</strong> Stáhni si celý zpěvník, ať funguje i bez signálu.</p>
      <button type="button" class="btn btn-line" id="offline-download-btn" data-sw-path="../sw.js"><span data-icon="download"></span><span>Stáhnout offline</span></button>
      <p class="offline-status" id="offline-status" aria-live="polite"></p>
    </div>
    <nav class="foot-nav" aria-label="Nástroje">
      <a href="../">Úvod</a>
      <a href="../na-kytaru/">Na kytaru</a>
      <a href="../na-foukaci-harmoniku/">Na harmoniku</a>
      <a href="../na-kalimbu/">Na kalimbu</a>
    </nav>
  </footer>

  <dialog class="sheet" id="sheet" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title">Řazení a filtry</h2>
      <button type="button" class="icon-btn" id="sheet-close" aria-label="Zavřít"><span data-icon="x"></span></button>
    </div>
    <div class="sheet-body">
      <section class="field">
        <h3>Řadit podle</h3>
        <div class="pills" role="radiogroup" aria-label="Řadit podle" id="sort-pills"></div>
        <button type="button" class="dir-btn" id="dir-btn"></button>
      </section>
      <section class="field">
        <h3>Jazyk</h3>
        <div class="seg" role="radiogroup" aria-label="Jazyk" id="lang-seg"></div>
      </section>
      <section class="field">
        <h3>Capo</h3>
        <div class="seg" role="radiogroup" aria-label="Capo" id="capo-seg"></div>
      </section>
      <section class="field">
        <h3>Akordy, které umím</h3>
        <p class="field-note" id="chord-note"></p>
        <div class="chord-actions">
          <button type="button" class="btn btn-line btn-sm" id="chords-all">Vybrat vše</button>
          <button type="button" class="btn btn-line btn-sm" id="chords-none">Zrušit vše</button>
        </div>
        <div class="chord-grid" id="chord-grid"></div>
      </section>
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn btn-line" id="sheet-reset">Zrušit filtry</button>
      <button type="button" class="btn btn-ink" id="sheet-done"></button>
    </div>
  </dialog>

  <script src="../js/song-list-core.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('../sw.js'));
    }
  </script>
  <script src="../js/offline-download.js"></script>
</body>
</html>
